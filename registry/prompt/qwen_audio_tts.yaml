# Qwen-Audio-3.0-TTS (DashScope, audio_evals/models/TTS/qwen_audio_tts.py) prompts.
#
# Unlike Qwen3-TTS (`registry/prompt/qwen3-tts.yaml`), which takes a
# free-form `language` string (e.g. "Chinese"), Qwen-Audio-3.0-TTS expects
# `language_hints`: a list of short ISO codes (only the first element is
# honored). Codes align with minimax-tts-eval language coverage.
#
# `prompt_text` (reference-audio transcript) is accepted for schema parity
# with other voice-clone prompts, but Qwen-Audio-3.0-TTS itself ignores it.

qwen-audio-tts-voice-clone-arabic:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      prompt_audio: "{{WavPath}}"
      prompt_text: "{{prompt_text}}"
      language_hints: ["ar"]

