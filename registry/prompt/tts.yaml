voice-clone:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      prompt_audio: "{{WavPath}}"
      prompt_text: "{{prompt_text}}"

# A/B variant: forwards `lang: en` so DotsTtsRuntime attaches an [EN]
# language tag to the prompt_text (see audio_evals/lib/DotsTTS/main.py,
# which maps `lang` -> `language` and lists it in _GENERATE_KWARGS).
# Isolates language tagging as the single changed variable against the
# tag-less `voice-clone` baseline.
voice-clone-en:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      lang: "en"
      prompt_audio: "{{WavPath}}"
      prompt_text: "{{prompt_text}}"

# Symmetric counterpart of voice-clone-en for the zh subset. Forwards
# `lang: zh` so DotsTtsRuntime attaches a [ZH] language tag. Used to
# verify the language-tag fix does not regress the already-matching
# zh result (CER 0.916 / SIM 80.83 vs official 0.94 / 81.0).
voice-clone-zh:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      lang: "zh"
      prompt_audio: "{{WavPath}}"
      prompt_text: "{{prompt_text}}"

# Generalization of voice-clone-en/zh to the remaining languages covered by
# the multilingual benchmarks (minimax_tts_* / cv3_*). Same single changed
# variable as the en experiment: only `lang` differs from the tag-less
# `voice-clone` baseline. Codes follow the eval_task naming in
# registry/eval_task/minimax.yaml (ISO 639-1, Cantonese as `yue`); the
# dots.tts runtime normalizes codes/names itself.
voice-clone-ar:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      lang: "ar"
      prompt_audio: "{{WavPath}}"
      prompt_text: "{{prompt_text}}"

